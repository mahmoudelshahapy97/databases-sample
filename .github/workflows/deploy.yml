# Continuous delivery.
#
#   ci        the whole of ci.yml; nothing ships that fails it
#   publish   build the sqlserver, oracle and sqlite images and push them to Docker
#             Hub, tagged by commit SHA
#   deploy    over SSH: sync the compose files and the bind-mounted seed data to the
#             host, pull those exact images, and `docker compose up -d --wait`
#
# Secrets (Settings -> Secrets and variables -> Actions):
#
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   push here, pull on the host
#   DEPLOY_HOST, DEPLOY_USER              where to SSH, port 22
#   DEPLOY_SSH_KEY                        private key; its public half in authorized_keys
#   DEPLOY_HOST_FINGERPRINT               the host key's SHA256 fingerprint, from
#                                           ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
#   DEPLOY_PATH                           absolute directory the stack lives in
#
# The database passwords never pass through here: they live in $DEPLOY_PATH/.env on
# the host. See .github/scripts/deploy.sh for what else the host needs (rsync
# included).
#
# These are stateful databases. A deploy never removes volumes, and the seed scripts
# only run against an empty volume, so changing a loader or its data does not
# re-seed an existing host: recreate that engine's volume by hand for that.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deploy halfway through; queue the next one behind it.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        image: [sqlserver, oracle, sqlite]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/multidb-${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/multidb-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_HOST_FINGERPRINT DEPLOY_PATH \
                   DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Trust the host key, and only that one
        # ssh-keyscan alone would trust whoever answers; the fingerprint secret is
        # what turns it into verification.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519_github
          chmod 600 ~/.ssh/id_ed25519_github

          want=${DEPLOY_HOST_FINGERPRINT#SHA256:}
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 15 "$DEPLOY_HOST" > scanned 2>/dev/null || true
          while read -r line; do
            case $line in ''|'#'*) continue ;; esac
            fp=$(ssh-keygen -lf - <<<"$line" | awk '{print $2}')
            if [ "${fp#SHA256:}" = "$want" ]; then
              echo "$line" >> ~/.ssh/known_hosts
            fi
          done < scanned
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::No host key from DEPLOY_HOST matches DEPLOY_HOST_FINGERPRINT"
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_ed25519_github
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Sync compose files and seed data
        # Everything the containers bind-mount from the host. Only changed files
        # travel; the data directories are over 500 MB.
        run: |
          ssh deploy "mkdir -p $(printf %q "$DEPLOY_PATH/.deploy")"
          rsync -az --delete -e ssh \
            docker-compose.yml docker-compose.prod.yml \
            postgres mysql sqlserver oracle sqlite \
            "deploy:$DEPLOY_PATH/"
          scp .github/scripts/deploy.sh "deploy:$DEPLOY_PATH/.deploy/"

      - name: Deploy
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          p="$DOCKERHUB_USERNAME/multidb"
          # The token goes over stdin, never onto a command line.
          ssh deploy "cd $(printf %q "$DEPLOY_PATH") && bash .deploy/deploy.sh \
            $(printf %q "$p-sqlserver:$GITHUB_SHA") \
            $(printf %q "$p-oracle:$GITHUB_SHA") \
            $(printf %q "$p-sqlite:$GITHUB_SHA") \
            $(printf %q "$DOCKERHUB_USERNAME")" <<<"$DOCKERHUB_TOKEN"
